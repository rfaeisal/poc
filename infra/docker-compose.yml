networks:
  poc-pecek-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  mosquitto-data:
  livekit-data:
  nginx-ssl:
  prometheus-data:
  grafana-data:

services:

  # ─────────────────────────────────────────
  # PostgreSQL — Database utama
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: poc-postgres
    restart: unless-stopped
    networks: [poc-pecek-net]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pocptx}
      POSTGRES_USER: ${POSTGRES_USER:-pocptx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pocptx}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5437:5432"

  # ─────────────────────────────────────────
  # Redis — Cache + Session + Pub/Sub internal
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: poc-redis
    restart: unless-stopped
    networks: [poc-pecek-net]
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:6380:6379"

  # ─────────────────────────────────────────
  # LiveKit — WebRTC SFU (core PTT engine)
  # ─────────────────────────────────────────
  livekit:
    image: livekit/livekit-server:latest
    container_name: poc-livekit
    restart: unless-stopped
    networks: [poc-pecek-net]
    command: >
      --config /etc/livekit.yaml
      --keys "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      --redis-host redis:6379
      --redis-password ${REDIS_PASSWORD}
      --dev
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    depends_on:
      redis:
        condition: service_healthy

  # ─────────────────────────────────────────
  # coturn — TURN/STUN server untuk NAT traversal
  # ─────────────────────────────────────────
  coturn:
    image: coturn/coturn:latest
    container_name: poc-coturn
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./coturn/turnserver.conf:/etc/turnserver.conf:ro
      - nginx-ssl:/etc/ssl/letsencrypt:ro
    command: -c /etc/turnserver.conf

  # ─────────────────────────────────────────
  # Mosquitto — MQTT broker untuk presence & notifikasi
  # ─────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: poc-mosquitto
    restart: unless-stopped
    networks: [poc-pecek-net]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - mosquitto-data:/mosquitto/data
      - nginx-ssl:/etc/ssl/letsencrypt:ro
    ports:
      - "1884:1883"
      - "8884:8883"
      - "9002:9001"

  # ─────────────────────────────────────────
  # Nginx — Reverse proxy + SSL
  # ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: poc-nginx
    restart: unless-stopped
    networks: [poc-pecek-net]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx-ssl:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - livekit
      - mosquitto

  # ─────────────────────────────────────────
  # Prometheus — Metrics collection
  # ─────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: poc-prometheus
    restart: unless-stopped
    networks: [poc-pecek-net]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  # ─────────────────────────────────────────
  # Grafana — Dashboard monitoring
  # ─────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: poc-grafana
    restart: unless-stopped
    networks: [poc-pecek-net]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_SERVER_ROOT_URL=https://admin.${DOMAIN}/grafana
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
