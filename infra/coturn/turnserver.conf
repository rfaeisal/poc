# Port
listening-port=3478
tls-listening-port=5349

# Binding
listening-ip=0.0.0.0
relay-ip=0.0.0.0

# External IP (ganti dengan IP publik server)
# external-ip=1.2.3.4

# TLS Certificate (diisi oleh setup.sh)
# cert=/etc/ssl/letsencrypt/live/DOMAIN/fullchain.pem
# pkey=/etc/ssl/letsencrypt/live/DOMAIN/privkey.pem
# dh-file=/etc/ssl/letsencrypt/dhparam.pem

# Auth
lt-cred-mech
# user=TURN_USERNAME:TURN_PASSWORD

# Security
no-loopback-peers
no-multicast-peers
fingerprint
no-stdout-log
syslog

# Realm (diisi oleh setup.sh)
# realm=turn.DOMAIN

# Port range untuk relay
min-port=49152
max-port=65535

# Logging
log-file=/var/log/turnserver.log
verbose
