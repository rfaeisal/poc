upstream backend_api {
    server backend:3000;
    keepalive 32;
}

upstream livekit_server {
    server livekit:7880;
}

upstream mqtt_ws {
    server mosquitto:9001;
}

server {
    listen 443 ssl;
    http2 on;
    server_name poc.fzdev.my.id;

    ssl_certificate /etc/letsencrypt/live/poc.fzdev.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/poc.fzdev.my.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=63072000" always;

    # ── Admin Portal (root) ──────────────────
    root /var/www/admin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Backend API ──────────────────────────
    location /api/ {
        proxy_pass http://backend_api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;
    }

    location /api/auth/ {
        proxy_pass http://backend_api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
    }

    # ── Webhook (no rate limit) ──────────────
    location /api/webhook/ {
        proxy_pass http://backend_api/webhook/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── LiveKit WebSocket ────────────────────
    location /livekit/ {
        proxy_pass http://livekit_server/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── MQTT over WebSocket ──────────────────
    location /mqtt/ {
        proxy_pass http://mqtt_ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
